[package]
name = "borrow-fighters"
version = "0.1.0-prototype.5"
edition = "2024"
description = "Greybox prototype for a docs-first 2D fighting game with programming humor."
license = "MIT OR Apache-2.0"
publish = false
default-run = "borrow-story"
autotests = false
autoexamples = false

[features]
default = ["fighting", "adventure"]
fighting = []
adventure = []

[[bin]]
name = "borrow-fighters"
path = "src/main.rs"
required-features = ["fighting"]

[[bin]]
name = "borrow-adventure"
path = "src/bin/borrow-adventure.rs"
required-features = ["adventure"]

[[bin]]
name = "borrow-story"
path = "src/bin/borrow-story.rs"
required-features = ["fighting", "adventure"]

[dependencies]
raylib = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

