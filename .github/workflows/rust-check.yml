name: Rust Check

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "assets/adventure/**"
      - "tools/check_domain_boundaries.py"
      - "tools/test_check_domain_boundaries.py"
      - ".github/workflows/rust-check.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "assets/adventure/**"
      - "tools/check_domain_boundaries.py"
      - "tools/test_check_domain_boundaries.py"
      - ".github/workflows/rust-check.yml"

permissions:
  contents: read

jobs:
  rust-check:
    name: domain boundaries, cargo fmt, feature tests, clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python for boundary checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check domain boundaries and explicit targets
        run: |
          python3 tools/check_domain_boundaries.py
          python3 -m unittest discover -s tools -p 'test_check_domain_boundaries.py'

      - name: Install native dependencies
        run: |
          # The runner's unrelated Chrome index can be inconsistent during updates.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            libasound2-dev \
            libclang-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Test both games
        run: cargo test --all-targets --all-features

      - name: Test fighting without adventure
        run: cargo test --all-targets --no-default-features --features fighting

      - name: Test adventure without fighting
        run: cargo test --all-targets --no-default-features --features adventure

      - name: Test shared core without either game
        run: cargo test --all-targets --no-default-features

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
